name: Build Final Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q akharin_nameh_shiraz_final_v1.zip -d project

          echo "Checking project files..."

          test -f project/settings.gradle
          test -f project/app/build.gradle

          echo "Android project extracted successfully."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          chmod 600 "$RUNNER_TEMP/release.jks"

          echo "Keystore decoded successfully."

      - name: Build signed release APK
        working-directory: project
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Check generated APK
        run: |
          echo "Generated APK files:"

          find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AkharinNamehShiraz-signed-release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            project/app/build/outputs/apk/release/*.apk \
            --title "آخرین نامه از شیراز $TAG" \
            --notes "نسخه امضاشده برنامه آخرین نامه از شیراز — نویسنده: میلاد شجیراتی"
