name: Build Final Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. دریافت پروژه
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. نصب Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"


      # --------------------------------------------------
      # 3. نصب Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # --------------------------------------------------
      # 4. نصب Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # --------------------------------------------------
      # 5. نصب Gradle 8.9
      # --------------------------------------------------
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # --------------------------------------------------
      # 6. استخراج پروژه Android
      # --------------------------------------------------
      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q akharin_nameh_shiraz_final_v1.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

          echo "Android project extracted successfully."


      # --------------------------------------------------
      # 7. اصلاح تنظیمات امضای پروژه
      # --------------------------------------------------
      - name: Fix release signing configuration
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          old = """    signingConfigs {
          release {
              def ks = System.getenv('KEYSTORE_FILE')
              def sp = System.getenv('KEYSTORE_PASSWORD')
              def kp = System.getenv('KEY_PASSWORD')
              if (ks != null && sp != null && kp != null) {
                  storeFile file(ks)
                  storePassword sp
                  keyAlias 'akharin-nameh-shiraz'
                  keyPassword kp
              }
          }
      }"""

          new = """    signingConfigs {
          release {
              def ks = System.getenv('KEYSTORE_FILE')
              def sp = System.getenv('KEYSTORE_PASSWORD')
              def ka = System.getenv('KEY_ALIAS')
              def kp = System.getenv('KEY_PASSWORD')

              if (ks != null && sp != null && ka != null && kp != null) {
                  storeFile file(ks)
                  storePassword sp
                  keyAlias ka
                  keyPassword kp
              }
          }
      }"""

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("Signing configuration replaced successfully.")
          else:
              print("Existing signing configuration did not exactly match old template.")

              s = s.replace(
                  "keyAlias 'akharin-nameh-shiraz'",
                  "keyAlias System.getenv('KEY_ALIAS')"
              )

              if "def ka = System.getenv('KEY_ALIAS')" not in s:
                  s = s.replace(
                      "def kp = System.getenv('KEY_PASSWORD')",
                      """def ka = System.getenv('KEY_ALIAS')
              def kp = System.getenv('KEY_PASSWORD')"""
                  )

              p.write_text(s)
              print("Signing configuration patched.")

          PY

          echo "Final signing configuration:"
          grep -A25 -B2 "signingConfigs" app/build.gradle


      # --------------------------------------------------
      # 8. Decode Keystore
      # --------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          chmod 600 "$RUNNER_TEMP/release.jks"

          test -s "$RUNNER_TEMP/release.jks"

          echo "Keystore file created successfully."

          ls -lh "$RUNNER_TEMP/release.jks"


      # --------------------------------------------------
      # 9. بررسی Keystore و Alias
      # --------------------------------------------------
      - name: Validate release keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |

          echo "========================================"
          echo "Checking release keystore"
          echo "========================================"

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          echo "Keystore file:"
          ls -lh "$KEYSTORE_FILE"

          echo ""
          echo "Listing keystore entries..."
          echo ""

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD"

          echo ""
          echo "Checking requested alias..."
          echo ""

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo ""
          echo "========================================"
          echo "Keystore validation successful."
          echo "========================================"


      # --------------------------------------------------
      # 10. ساخت APK امضاشده
      # --------------------------------------------------
      - name: Build signed release APK
        working-directory: project
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          test -n "$KEYSTORE_FILE"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "========================================"
          echo "Building signed release APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease


      # --------------------------------------------------
      # 11. بررسی APK ساخته شده
      # --------------------------------------------------
      - name: Check generated APK
        run: |

          echo "========================================"
          echo "Generated APK files:"
          echo "========================================"

          find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK_FILE"

          echo ""
          echo "APK successfully generated:"
          echo "$APK_FILE"


      # --------------------------------------------------
      # 12. آپلود APK در Artifacts
      # --------------------------------------------------
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AkharinNamehShiraz-signed-release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error


      # --------------------------------------------------
      # 13. ساخت GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            project/app/build/outputs/apk/release/*.apk \
            --title "آخرین نامه از شیراز $TAG" \
            --notes "نسخه امضاشده برنامه آخرین نامه از شیراز — نویسنده: میلاد شجیراتی"
