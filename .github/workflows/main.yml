name: Build Final Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          echo "Checking project ZIP..."

          test -f akharin_nameh_shiraz_final_v1.zip || {
            echo "::error::Project ZIP not found."
            exit 1
          }

          rm -rf project
          mkdir -p project

          unzip -q akharin_nameh_shiraz_final_v1.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

          echo "Project extracted successfully."

      - name: Fix signing configuration
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("project/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          start = text.find("signingConfigs {")

          if start == -1:
              raise SystemExit("signingConfigs block not found")

          build_types = text.find("buildTypes {", start)

          if build_types == -1:
              raise SystemExit("buildTypes block not found")

          signing_block = """signingConfigs {
              release {
                  def ks = System.getenv('KEYSTORE_FILE')
                  def sp = System.getenv('KEYSTORE_PASSWORD')
                  def ka = System.getenv('KEY_ALIAS')
                  def kp = System.getenv('KEY_PASSWORD')

                  if (ks && sp && ka && kp) {
                      storeFile file(ks)
                      storePassword sp
                      keyAlias ka
                      keyPassword kp
                  }
              }
          }

          """

          text = text[:start] + signing_block + text[build_types:]

          path.write_text(text, encoding="utf-8")

          print("Signing configuration fixed.")
          PY

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is empty."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          chmod 600 "$RUNNER_TEMP/release.jks"

          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Keystore decoding failed."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Build signed release APK
        working-directory: project
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Starting release build..."

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD is empty."
            exit 1
          fi

          echo "KEY_ALIAS is configured."

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Check generated APK
        run: |
          echo "Searching for APK..."

          APK=$(find \
            project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AkharinNamehShiraz-signed-release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            project/app/build/outputs/apk/release/*.apk \
            --title "آخرین نامه از شیراز $TAG" \
            --notes "نسخه امضاشده برنامه آخرین نامه از شیراز"

          echo "Release created: $TAG"
