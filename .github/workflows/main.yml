name: Build Final Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------
      # 2. Java 17
      # -----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"


      # -----------------------------
      # 3. Android SDK
      # -----------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # -----------------------------
      # 4. Gradle
      # -----------------------------
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"


      # -----------------------------
      # 5. Extract project ZIP
      # -----------------------------
      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q akharin_nameh_shiraz_final_v1.zip -d project

          echo "Checking project files..."

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

          echo "Project OK"


      # -----------------------------
      # 6. Fix Gradle signing
      # -----------------------------
      - name: Configure release signing
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          # KEYSTORE_FILE
          s = re.sub(
              r"def ks\s*=\s*System\.getenv\(['\"]KEYSTORE_FILE['\"]\)",
              "def ks = System.getenv('KEYSTORE_FILE')",
              s
          )

          # KEYSTORE_PASSWORD
          s = re.sub(
              r"def sp\s*=\s*System\.getenv\(['\"]KEYSTORE_PASSWORD['\"]\)",
              "def sp = System.getenv('KEYSTORE_PASSWORD')",
              s
          )

          # KEY_ALIAS
          if "def ka = System.getenv('KEY_ALIAS')" not in s:
              s = s.replace(
                  "def kp = System.getenv('KEY_PASSWORD')",
                  "def ka = System.getenv('KEY_ALIAS')\n            def kp = System.getenv('KEY_PASSWORD')"
              )

          # Replace hard-coded alias
          s = s.replace(
              "keyAlias 'akharin-nameh-shiraz'",
              "keyAlias ka"
          )

          s = s.replace(
              'keyAlias "akharin-nameh-shiraz"',
              "keyAlias ka"
          )

          # Add PKCS12 store type
          if "storeType 'pkcs12'" not in s and 'storeType "pkcs12"' not in s:
              s = s.replace(
                  "storeFile file(ks)",
                  "storeFile file(ks)\n            storeType 'pkcs12'"
              )

          # Make sure all four values are required
          s = s.replace(
              "if (ks != null && sp != null && kp != null)",
              "if (ks != null && sp != null && ka != null && kp != null)"
          )

          # Save
          p.write_text(s)

          print("===== FINAL app/build.gradle =====")
          print(s)
          print("===== END =====")
          PY


      # -----------------------------
      # 7. Decode keystore
      # -----------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

          chmod 600 "$RUNNER_TEMP/release.jks"

          test -s "$RUNNER_TEMP/release.jks"

          echo "Keystore decoded successfully."


      # -----------------------------
      # 8. Check required secrets
      # -----------------------------
      - name: Check signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is empty."
            exit 1
          fi

          echo "KEY_ALIAS received: $KEY_ALIAS"
          echo "All signing secrets are present."


      # -----------------------------
      # 9. Verify keystore alias
      # -----------------------------
      - name: Check keystore alias
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "Checking keystore..."

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore and alias are valid."


      # -----------------------------
      # 10. Build release APK
      # -----------------------------
      - name: Build signed release APK
        working-directory: project
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Starting Gradle build..."

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease


      # -----------------------------
      # 11. Find APK
      # -----------------------------
      - name: Check generated APK
        run: |
          set -e

          echo "Searching for APK..."

          find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"


      # -----------------------------
      # 12. Rename APK
      # -----------------------------
      - name: Prepare final APK
        run: |
          set -e

          mkdir -p final-apk

          APK=$(find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          cp "$APK" \
            final-apk/Akharin-Nameh-Shiraz-v1.0.0-release.apk

          ls -lh final-apk/


      # -----------------------------
      # 13. Upload artifact
      # -----------------------------
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AkharinNamehShiraz-signed-release
          path: final-apk/Akharin-Nameh-Shiraz-v1.0.0-release.apk
          if-no-files-found: error


      # -----------------------------
      # 14. Create GitHub Release
      # -----------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            final-apk/Akharin-Nameh-Shiraz-v1.0.0-release.apk \
            --title "آخرین نامه از شیراز $TAG" \
            --notes "نسخه امضاشده برنامه آخرین نامه از شیراز"
