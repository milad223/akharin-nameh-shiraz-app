name: Build Final Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q akharin_nameh_shiraz_final_v1.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

          echo "Android project extracted successfully."

      - name: Fix release signing configuration
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "def kp = System.getenv('KEY_PASSWORD')",
              """def ka = System.getenv('KEY_ALIAS')
            def kp = System.getenv('KEY_PASSWORD')"""
          )

          s = s.replace(
              "if (ks != null && sp != null && kp != null)",
              "if (ks != null && sp != null && ka != null && kp != null)"
          )

          s = s.replace(
              "keyAlias 'akharin-nameh-shiraz'",
              "keyAlias ka"
          )

          p.write_text(s)

          print("Release signing configuration patched.")
          PY

          echo "Checking signing configuration:"
          grep -A15 -B2 "signingConfigs" app/build.gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          chmod 600 "$RUNNER_TEMP/release.jks"

          test -s "$RUNNER_TEMP/release.jks"

          echo "Keystore file created."

      - name: Validate release keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          echo "Checking keystore..."

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore and alias are valid."

      - name: Build signed release APK
        working-directory: project
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_FILE"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Building signed release APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Check generated APK
        run: |
          echo "Generated APK:"

          find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find project/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AkharinNamehShiraz-signed-release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            project/app/build/outputs/apk/release/*.apk \
            --title "آخرین نامه از شیراز $TAG" \
            --notes "نسخه امضاشده برنامه آخرین نامه از شیراز — نویسنده: میلاد شجیراتی"
